<style>
/* Layout: Stadiongelände. Oben Umlauf mit Tribüne, Mitte Busbuchten, unten Busparkplatz, rundherum Rasen. */
:root {
  --sea: #3E9B4F;
  --teal: #232C36;
  --teal-dark: #11171D;
  --sun: #FFD54F;
  --coral: #E3001B;
  --coral-dark: #9E0016;
  --ink: #1A2128;
  --muted: #5A6570;
  --card: #FFFFFF;
  --font-display: "Baloo 2", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--sea); color: var(--ink); font-family: var(--font-body); overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
#app { position: fixed; inset: 0; }
#cv { position: absolute; inset: 0; display: block; }
#safe { position: absolute; width: 0; height: 0; padding-bottom: env(safe-area-inset-bottom, 0px); visibility: hidden; }
.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: calc(8px + env(safe-area-inset-top, 0px)) 4px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.hud > * { pointer-events: auto; zoom: var(--z, 1); }
.board { display: flex; align-items: baseline; gap: 8px; min-width: 0; background: var(--teal); color: var(--sun); border: 0; border-radius: 14px; padding: 1px 13px 2px; font-family: var(--font-display); box-shadow: 0 3px 0 var(--teal-dark); cursor: pointer; }
.board-k { font-weight: 800; font-size: 21px; }
.board-v { font-weight: 700; font-size: 15px; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-right { display: flex; gap: 6px; }
.chip, .icon { height: 36px; border: 0; border-radius: 12px; background: var(--teal); color: #FFFFFF; font-family: var(--font-display); font-weight: 800; font-size: 16px; box-shadow: 0 3px 0 var(--teal-dark); cursor: pointer; display: grid; place-items: center; }
.chip { padding: 0 11px; color: var(--sun); white-space: nowrap; }
.chip:disabled { opacity: .4; cursor: default; }
.icon { width: 36px; }
.icon svg { width: 18px; height: 18px; }
button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.toast { zoom: var(--z, 1); position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); background: var(--coral); color: #FFFFFF; font-family: var(--font-display); font-weight: 800; font-size: 21px; padding: 6px 20px; border-radius: 999px; box-shadow: 0 4px 0 var(--coral-dark); pointer-events: none; white-space: nowrap; }
.hint { zoom: var(--z, 1); box-sizing: border-box; position: absolute; left: 50%; top: calc(60px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(calc(92vw / var(--z, 1)), 400px); background: linear-gradient(180deg, #FFFFFF, #F1F2F4); color: var(--ink); border: 3px solid #FFFFFF; border-radius: 18px; padding: 10px 16px 10px 46px; font-size: 15px; font-weight: 700; line-height: 1.4; text-align: left; pointer-events: none; box-shadow: 0 6px 0 rgba(17,23,29,.18), 0 10px 24px rgba(17,23,29,.25); }
/* Kleiner Ball links im Hinweis */
.hint::before { content: ""; position: absolute; left: 12px; top: 50%; width: 20px; height: 20px; margin-top: -10px; border-radius: 50%; border: 2px solid #1A2128; background: radial-gradient(circle, #1A2128 0 28%, #FFFFFF 31%); }
.hint b { color: var(--coral); }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, rgba(62,155,79,.35), rgba(17,23,29,.65)); padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
/* Karten wie ein Fanschal: rot-weiße Streifen oben, Rasenkante unten. */
.card { position: relative; overflow: hidden; width: 100%; max-width: 340px; max-height: calc((100vh - 32px) / var(--z, 1)); overflow-y: auto; zoom: var(--z, 1); color: var(--ink); border: 4px solid #FFFFFF; border-radius: 28px; padding: 40px 20px 30px; text-align: center; box-shadow: 0 8px 0 rgba(17,23,29,.25), 0 18px 40px rgba(17,23,29,.35);
  background: linear-gradient(#3E9B4F, #3E9B4F) left bottom / 100% 10px no-repeat, linear-gradient(180deg, #FFFFFF 0%, #EEF0F2 100%); }
.card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 26px;
  background: repeating-linear-gradient(90deg, #E3001B 0 22px, #FFFFFF 22px 44px);
  -webkit-mask: radial-gradient(circle 11px at 11px 14px, #000 98%, transparent) 0 0 / 22px 26px repeat-x, linear-gradient(#000 0 0) 0 0 / 100% 14px no-repeat;
  mask: radial-gradient(circle 11px at 11px 14px, #000 98%, transparent) 0 0 / 22px 26px repeat-x, linear-gradient(#000 0 0) 0 0 / 100% 14px no-repeat; }
.card .eyebrow { display: inline-block; font-family: var(--font-display); font-weight: 800; font-size: 13px; color: var(--sun); background: var(--teal); border-radius: 999px; padding: 2px 12px; box-shadow: 0 2px 0 var(--teal-dark); }
.card h2 { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1.05; color: var(--teal); margin: 8px 0 10px; text-wrap: balance; text-shadow: 0 2px 0 #FFFFFF; }
.card p { margin: 0 0 16px; font-size: 15px; line-height: 1.45; color: #3A4550; }
.actions { display: grid; gap: 10px; }
.btn { height: 48px; border: 0; border-radius: 16px; font-family: var(--font-display); font-weight: 800; font-size: 20px; cursor: pointer; background: var(--coral); color: #FFFFFF; box-shadow: 0 4px 0 var(--coral-dark); }
.btn.alt { background: #FFFFFF; color: var(--teal); box-shadow: 0 4px 0 #C9CDD2; }
.btn { border-radius: 999px; }
.tabs { display: flex; gap: 6px; justify-content: center; margin: -2px 0 12px; }
.tabs button { border: 0; border-radius: 999px; padding: 6px 14px; font-family: var(--font-display); font-weight: 800; font-size: 15px; background: #FFFFFF; color: var(--teal); box-shadow: 0 2px 0 #C9CDD2; cursor: pointer; }
.tabs button.on { background: var(--teal); color: var(--sun); box-shadow: 0 2px 0 var(--teal-dark); }
.levels button.storm:not(:disabled) { background: #3E4A8C; box-shadow: 0 3px 0 #262E5E; }
.levels button.storm::before { content: "Sturm"; font-family: var(--font-body); font-size: 9px; color: #C9D3FF; }
.levels button.done { background: #FFC400; color: var(--teal-dark); box-shadow: 0 3px 0 #D99A00; }
.levels button.done small { color: var(--teal-dark); }
.medal { width: 76px; height: 76px; margin: 10px auto 2px; border-radius: 50%; display: grid; place-items: center; color: #FFFFFF; font-size: 42px; background: radial-gradient(circle at 35% 30%, #FFF3A0, #FFC400 60%, #D99A00); border: 4px solid #FFFFFF; box-shadow: 0 4px 0 #B07A00; animation: starpop .5s cubic-bezier(.3,1.6,.5,1) both; }
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
.levels button { aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 14px; background: var(--teal); color: var(--sun); font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1; box-shadow: 0 3px 0 var(--teal-dark); cursor: pointer; display: grid; place-content: center; gap: 2px; }
.levels button small { font-size: 10px; letter-spacing: 0; color: #FFB3BB; }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); } to { transform: none; } }
.stars3 { display: flex; justify-content: center; gap: 4px; margin: 0 0 12px; }
.stars3 div { flex: 1; max-width: 92px; display: grid; justify-items: center; gap: 2px; }
.stars3 span { font-size: 44px; line-height: 1; color: #E1E4E8; }
.stars3 .on span { color: #FFC400; text-shadow: 0 3px 0 #D99A00; animation: starpop .45s cubic-bezier(.3,1.6,.5,1) both; }
.stars3 small { font-size: 11px; font-weight: 800; color: #8D969E; line-height: 1.2; }
.stars3 .on small { color: var(--teal); }
@media (prefers-reduced-motion: reduce) { .stars3 .on span { animation: none; } }
.loot { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 10px; }
.chip-l { background: #FFFFFF; border-radius: 14px; padding: 7px 8px; box-shadow: 0 2px 0 #D5D9DE; font-size: 13px; font-weight: 700; color: var(--muted); display: grid; justify-items: center; gap: 2px; }
.chip-l b { font-family: var(--font-display); font-size: 20px; color: var(--teal); line-height: 1.1; }
.chip-l.shell b { color: var(--coral); }
.chip-l small { font-size: 11px; line-height: 1.25; }
.chip-l .dots { display: flex; gap: 4px; }
.chip-l .dots i { width: 18px; height: 6px; border-radius: 3px; background: #E1E4E8; }
.chip-l .dots i.on { background: var(--coral); }
.loot-stamps { display: flex; align-items: center; justify-content: center; gap: 5px; margin: 0 0 12px; font-size: 12px; font-weight: 800; color: var(--muted); }
.loot-stamps img { width: 24px; height: 16px; border-radius: 3px; box-shadow: 0 0 0 2px #FFFFFF; }
.loot-stamps span { margin-left: 4px; }
.minis { display: flex; gap: 8px; }
.progress { margin: 0 0 12px; }
.progress .meter { margin: 0 0 6px; height: 16px; border-radius: 8px; background: #E1E4E8; }
.progress-l { display: flex; align-items: baseline; justify-content: center; gap: 6px; font-weight: 800; font-size: 14px; color: var(--muted); }
.progress-l b { font-family: var(--font-display); font-size: 24px; color: var(--coral); }
.progress-l span { font-size: 12px; font-weight: 700; }
.loot.one { grid-template-columns: 1fr; }
.chip-l.warn { background: #FFE3DE; box-shadow: 0 2px 0 #F2B3A8; }
.chip-l.warn b { color: var(--coral-dark); }
.mini { flex: 1; min-height: 46px; border: 0; border-radius: 16px; background: #FFFFFF; color: var(--teal); font-family: var(--font-display); font-weight: 800; font-size: 15px; line-height: 1.1; box-shadow: 0 3px 0 #C9CDD2; cursor: pointer; display: grid; place-content: center; padding: 4px 6px; }
.mini small { font-family: var(--font-body); font-size: 11px; font-weight: 700; color: var(--muted); }
.mini.hot { background: var(--sun); box-shadow: 0 3px 0 #D9B330; position: relative; }
.mini.hot::after { content: ""; position: absolute; top: -3px; right: -3px; width: 12px; height: 12px; border-radius: 50%; background: var(--coral); border: 2px solid #FFFFFF; }
.shop-row.sub { margin-left: 18px; background: #F4F5F7; }
.shop-row .tier { color: var(--coral); letter-spacing: 1px; }
.levels button:disabled { background: #E1E9E8; color: #9FB2B5; box-shadow: none; cursor: default; }
.levels button.cur { outline: 3px solid var(--coral); outline-offset: 2px; }
.levels { max-height: 44vh; overflow-y: auto; padding: 5px; }
.chip svg { width: 22px; height: 16px; margin-right: 4px; }
.chip.tow { display: flex; align-items: center; }
.chip.armed { background: var(--coral); color: #FFFFFF; box-shadow: 0 3px 0 var(--coral-dark); }
.card p.small { font-size: 14px; margin-bottom: 14px; }
.meter { height: 12px; border-radius: 6px; background: #E1E9E8; margin: -6px 0 16px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--coral); border-radius: 6px; }
.newstamps { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 0 0 14px; }
.newstamps span { display: flex; align-items: center; gap: 6px; background: #FFE9EB; border-radius: 10px; padding: 3px 9px 3px 4px; font-size: 13px; font-weight: 800; }
.newstamps img, .stamp img, .stamp .q { width: 30px; height: 20px; border-radius: 3px; flex: none; }
.pass { display: grid; gap: 7px; max-height: 50vh; overflow-y: auto; margin-bottom: 16px; text-align: left; }
.stamp { display: flex; gap: 10px; align-items: center; background: #FFFFFF; border-radius: 14px; padding: 7px 10px; box-shadow: 0 2px 0 #D5D9DE; }
.stamp > div { flex: 1; min-width: 0; }
.stamp b { display: flex; justify-content: space-between; font-family: var(--font-display); font-size: 15px; }
.stamp .stars { color: var(--coral); letter-spacing: 1px; }
.stamp small { display: block; font-size: 12px; color: var(--muted); }
.stamp .bar { height: 5px; background: #E1E9E8; border-radius: 3px; margin-top: 3px; overflow: hidden; }
.stamp .bar span { display: block; height: 100%; background: var(--coral); }
.stamp.locked { opacity: .55; }
.btn:disabled { opacity: .5; cursor: default; }
.shop { display: grid; gap: 6px; max-height: 52vh; overflow-y: auto; margin-bottom: 14px; text-align: left; }
.shop h3 { font-family: var(--font-display); font-size: 15px; color: var(--muted); margin: 6px 0 0; }
.shop-row { display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 14px; padding: 6px 6px 6px 12px; box-shadow: 0 2px 0 #D5D9DE; }
.shop-row span { flex: 1; font-weight: 800; font-size: 15px; }
.shop-row small { display: block; font-weight: 700; font-size: 12px; color: var(--muted); }
.shop-row button { height: 36px; min-width: 96px; border: 0; border-radius: 10px; background: var(--coral); color: #FFFFFF; font-family: var(--font-display); font-weight: 800; font-size: 14px; box-shadow: 0 3px 0 var(--coral-dark); cursor: pointer; }
.shop-row button.alt { background: #E6F5F2; color: var(--teal); box-shadow: 0 3px 0 #C4DED9; }
.shop-row button { border-radius: 999px; }
.shop-row button:disabled { opacity: .45; cursor: default; }
.stamp .q { display: grid; place-items: center; background: #C9D6D8; color: #FFFFFF; font-weight: 800; }
</style>

<div id="app">
  <canvas id="cv" aria-label="Spielfeld: Stadionumlauf, Busbuchten und Busparkplatz"></canvas>
  <div id="safe"></div>
  <header class="hud">
    <button id="lvlBtn" class="board" aria-label="Level wählen"><span id="lvlNum" class="board-k">1</span><span id="lvlTxt" class="board-v">Erstes Spiel</span></button>
    <div class="hud-right">
      <button id="towBtn" class="chip tow" aria-label="Abschleppwagen benutzen" hidden><svg viewBox="0 0 22 16" fill="currentColor"><rect x="1" y="5" width="13" height="6" rx="2"/><rect x="8" y="1" width="6" height="5" rx="1.5"/><path d="M14 8h6v2h-6z"/><circle cx="4.5" cy="12.5" r="2.5"/><circle cx="11.5" cy="12.5" r="2.5"/></svg><span id="towN">1</span></button>
      <button id="lookBtn" class="icon" aria-label="Optik umschalten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><g id="lookDetail"><path d="M12 7v2M12 15v2M7 12h2M15 12h2"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></g></svg></button>
      <button id="passBtn" class="icon" aria-label="Fan-Album"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10.5" r="3"/><path d="M9 17h6"/></svg></button>
      <button id="restartBtn" class="icon" aria-label="Level neu starten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg></button>
      <button id="muteBtn" class="icon" aria-label="Ton aus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="muteWave" d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button>
    </div>
  </header>
  <div id="toast" class="toast" hidden></div>

</div>

<script id="logic">
// Spiellogik ohne DOM. Wird auch von den Tests geladen.
window.Abflug = (() => {
  const SEATS = { 2: 16, 3: 24, 4: 40 };
  const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
  const DKEYS = ["U", "D", "L", "R"];
  // Auswärtsteams: Spitznamen statt Vereinsnamen, keine Wappen. Hauptfarbe für Bus und Trikot,
  // Zweitfarbe für Busband und Schal. light: helle Hauptfarbe, braucht dunkle Schrift.
  const DEST = [
    { id: "LN", name: "Lüdenscheid-Nord", color: "#FFD200", color2: "#1A1A1A", text: "#1A1A1A", light: true },
    { id: "FK", name: "Die Fischköppe", color: "#2DBE5A", color2: "#FFFFFF", text: "#FFFFFF" },
    { id: "BC", name: "Big City Club", color: "#4DB6F2", color2: "#FFFFFF", text: "#0B2E4A" },
    { id: "GB", name: "Die Geißböcke", color: "#E3001B", color2: "#FFFFFF", text: "#FFFFFF" },
    { id: "BD", name: "Der Bundesliga-Dino", color: "#F4F4F0", color2: "#0A2D6E", text: "#0A2D6E", light: true },
    { id: "HW", name: "Herne-West", color: "#1E4FD0", color2: "#FFFFFF", text: "#FFFFFF" },
    { id: "RT", name: "Die Roten Teufel", color: "#8E1230", color2: "#FFFFFF", text: "#FFFFFF" },
    { id: "FE", name: "Die Fohlenelf", color: "#0B5E33", color2: "#1A1A1A", text: "#FFFFFF" },
    { id: "BR", name: "Die Brustringträger", color: "#F4F4F0", color2: "#E3001B", text: "#C00018", light: true },
    { id: "DM", name: "Diva vom Main", color: "#22252B", color2: "#E3001B", text: "#FFFFFF" },
  ];

  function rng(seed) {
    return () => {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const grid = (c, r, f) => Array.from({ length: r }, (_, y) => Array.from({ length: c }, (_, x) => !!f(x, y)));
  const art = rows => rows.map(s => [...s].map(ch => ch === "#"));
  // Maske vergrößern: kompakte Flugzeuge erlauben ein dichteres Vorfeld.
  const up = (m, f) => grid(Math.round(m[0].length * f), Math.round(m.length * f), (x, y) => m[Math.floor(y / f)][Math.floor(x / f)]);

  // Wartering im Terminal: RING Reihen à 4 Plätze, Position 0 ist der Ausgang zu den Gates.
  const RING = 20, ENTRY = { L: 7, R: 13 };

  const LEVELS = [
    // Tutorial: festes Level. Flugzeug 0 ist frei, 1 wird von 2 blockiert.
    { name: "Erstes Spiel", tutorial: true, dests: 3, planes: 8, mode: "seq", fixed: {
      cols: 5, rows: 6,
      planes: [
        [1, 1, "U", 2, 1], [2, 3, "R", 3, 0], [3, 4, "D", 2, 3], [0, 5, "L", 2, 0],
        [4, 0, "U", 3, 3], [3, 1, "R", 2, 1], [2, 5, "D", 2, 0], [0, 1, "U", 2, 3],
      ],
      L: [[1, 16], [3, 16], [0, 24], [3, 24]],
      R: [[1, 16], [0, 16], [3, 16], [0, 16]],
      sol: [0, 2, 1, 4, 5, 3, 7, 6],
    } },
    { name: "Anpfiff", mask: grid(8, 10, () => 1), dests: 5, planes: 24, mode: "seq" },
    { name: "Nordkurve", mask: grid(9, 12, (x, y) => !((x === 0 || x === 8) && (y === 0 || y === 11))), dests: 6, planes: 32, mode: "seq" },
    { name: "Schranken", mask: grid(10, 13, () => 1), dests: 6, planes: 40, mode: "alt" },
    { name: "Pokal", mask: up(art([
      "....##....",
      "...####...",
      "...####...",
      "..######..",
      "##########",
      "##########",
      ".########.",
      "...####...",
      "...####...",
      "...####...",
      "..######..",
      "..######..",
    ]), 1.3), dests: 7, planes: 44, mode: "alt" },
    { name: "Nebelspiel", mask: grid(13, 13, (x, y) => Math.abs(x - 6) + Math.abs(y - 6) <= 7), dests: 7, planes: 44, mode: "alt", mystery: 0.25 },
    { name: "Busdepot", mask: grid(11, 14, () => 1), dests: 8, planes: 52, mode: "alt", hangars: 1, hangarSize: 4 },
    { name: "Sporttasche", mask: up(art([
      "...####...",
      "...#..#...",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",

  // Alle Flugzeuge, die weg müssen, bevor p frei ist. null, wenn ein Hangar-Flugzeug im Weg steht.
  function blockersOf(st, p) {
    const need = new Set(), stack = [p.id], m = occMap(st);

  // Schlange bauen, indem ein Spiel mit vier Gates simuliert wird. Mit Wahrscheinlichkeit dig

  // Blocker so lange an den Gates parken. Die Reihenfolge der Abflüge ist die Lösung.
  function buildQueue(base, r, dig, maxB) {

  // Spielt die Lösungsreihenfolge stur durch: so früh wie möglich losrollen, sonst Ring laufen lassen.
  function solve(lv, onTap) {
    const st = createState(lv);
    let idx = 0;
    for (let n = 0; n < 400000; n++) {
      st.planes.forEach(p => { if (p.where === "full") depart(st, p.id); });
      const s = status(st);

      if (s === "lose") return false;
      if (idx < lv.sol.length) {

        if (r.ok) { onTap?.(lv.sol[idx], st); arrive(st, lv.sol[idx]); idx++; continue; }
        if (r.reason !== "gates" && r.reason !== "locked") return false;
      }
      tick(st);
    }
    return false;
  }

  function fixedLevel(L) {
    const F = L.fixed;

    const g = a => a.map(([dest, n]) => ({ dest, n }));
    const arms = { L: g(F.L), R: g(F.R) };
    return {
      name: L.name, cols: F.cols, rows: F.rows, mask: grid(F.cols, F.rows, () => 1), mode: L.mode, planes, hangars: [],

  }

  // Jedes fünfte Level ab Level 5 ist ein Sturm-Level: mehr und tiefer zugeparkte Ziele.
  const isStorm = li => li >= 4 && (li + 1) % 5 === 0;

  // Gewinnt er das Level, ist es kaum ein Rätsel. Dient nur dem Messen der Schwierigkeit.
  function greedy(lv) {

      if (s === "lose") return false;

      idle++;
      if (s === "play") {

  // ---------- Layout ----------

    const islandBottom = Math.min(H - sab - 4, ay + cell * S.rows + 26);
    lay = {
      ox, gw, top, termH, gatesH, gy0, slotW, slotH, gc, gates, cell, ax, ay, d, laneW, cx, arms,
      ring, rad, cyR, x0, x1, exit: { x: cx, y: cyR + rad },
      capRows: chal?.id === "sicht" ? { L: 1, R: 1 } : { L: Math.min(5, Math.floor((arms.L.total - d) / d)), R: Math.min(5, Math.floor((arms.R.total - d) / d)) },
      laneY: gy0 + gatesH + 6, sab,
      island: { x: ox + 4, y: -40, w: gw - 8, h: islandBottom + 40 },
    };
  }

  // ---------- Level ----------
  function startLevel(i, ch = null) {
    levelIdx = Math.max(0, i);
    chal = levelIdx > 0 ? ch : null;
    lv = cache[levelIdx] || (cache[levelIdx] = A.generate(levelIdx));
    setMusicStyle(lv.storm ? "funk" : chal ? "house" : "son");
    store.set("abpfiff.level", levelIdx);
    lv = cache[levelIdx] || (cache[levelIdx] = A.generate(levelIdx));
    S = A.createState(lv, { lookahead: fx("leucht", "look", 0), fog: chal?.id === "nebel" });
    vis = new Map(); flyers = []; departing = []; confetti = []; sparks = []; floats = []; tips = 0;
    ringT = 0; ended = false; shift = { L: 0, R: 0 }; gateFlash = -9; shakeT = -9; pulse = [];
    $("#overlay").hidden = true;
    $("#lvlNum").textContent = levelIdx + 1;
    $("#lvlTxt").textContent = chal ? `${lv.name} · ${chal.name}` : lv.storm ? `${lv.name} · Sturm` : lv.name;
    $("#lvlBtn").setAttribute("aria-label", `Level ${levelIdx + 1}: ${lv.name}. Level wählen`);
    layout();
    tut = null; newStamps = []; towArmed = false;
    // Siegesserie bringt bis zu 3 Schlepper, der Kontrollturm einen weiteren.
    tows = A.levelDef(levelIdx).tutorial || chal ? 0 : Math.min(3, streak) + fx("turm", "tows", 0);
    towsUsed = 0;
    syncTow();
    if (A.levelDef(levelIdx).tutorial) { tut = { step: -1 }; tutNext(); }
    else if (chal) showHint(`<b>Herausforderung ${chal.name}:</b> ${chal.text} Ohne Abschleppwagen und ohne zweite Chance.`, 7);
    else if (lv.storm) showHint(`<b>Sturm!</b> Hier sind mehr Teams tief zugeparkt${lv.gates === 3 ? ", und es gibt nur 3 Busbuchten (die zweite Chance öffnet eine vierte)" : ""}. Dafür gibt es doppelte Brezn.`, 6.5);
    else if (INTRO[levelIdx]) showHint(INTRO[levelIdx], 6.5); else hideHint();
    if (tows) setTimeout(() => toast(streak ? `Serie ${streak}: ${tows} Abschleppwagen bereit` : `Abschlepphof: ${tows} Abschleppwagen bereit`, 2200), 400);
  }
  function tutNext() {
    tut.step++;
    if (tut.step >= TUT.length) { tut = null; hideHint(); return; }
    const s = TUT[tut.step];
    showHint(s.text, 0);
    if (s.timeout) setTimeout(() => { if (tut && TUT[tut.step] === s) tutNext(); }, s.timeout * 1000);
  }
  // Am Gate: kleine Flugzeuge größer zeichnen, damit jedes Gate gut gefüllt ist.
  // Am Gate höchstens wenig größer als auf dem Vorfeld, damit die Gates nicht alles dominieren.
  function gateC(p) { return Math.min(lay.slotW * 0.8, (lay.slotH * 0.95) / (p.len * 0.95), lay.cell * 1.15); }
  function planeCenter(p) {
    const [dx, dy] = A.DIRS[p.dir], c = lay.cell;
    const nx = lay.ax + (p.x + 0.5) * c, ny = lay.ay + (p.y + 0.5) * c;
    return { x: nx - (dx * (p.len - 1) * c) / 2, y: ny - (dy * (p.len - 1) * c) / 2 };
  }
  function taxiPath(p) {
    const c = lay.cell, [dx, dy] = A.DIRS[p.dir], cen = planeCenter(p);
    const steps = dx > 0 ? S.cols - 1 - p.x : dx < 0 ? p.x : dy > 0 ? S.rows - 1 - p.y : p.y;
    const out = (steps + p.len / 2 + 0.7) * c;
    const g = lay.gates[p.gate], ly = lay.laneY;
    const minX = lay.ox + c * 0.5, maxX = lay.ox + lay.gw - c * 0.5;
    const pts = [[cen.x, cen.y]];
    if (dy < 0) pts.push([cen.x, ly]);
    else if (dy > 0) {
      const y1 = Math.min(H - 6, cen.y + out);
      const sideX = cen.x < lay.cx ? Math.max(lay.ox + 12, lay.ax - c * 0.6) : Math.min(lay.ox + lay.gw - 12, lay.ax + S.cols * c + c * 0.6);
      pts.push([cen.x, y1], [sideX, y1], [sideX, ly]);
    } else {
      const x1 = Math.max(minX, Math.min(maxX, cen.x + dx * out));
      pts.push([x1, cen.y], [x1, ly]);
    }
    pts.push([g.x, ly], [g.x, g.y]);
    const pl = poly(pts);
    return { pl, firstLen: pl.segs[0].l, dur: Math.max(0.55, pl.total / 1100 + 0.15) };
  }
  // Weg eines Touristen: Ring-Ausgang, an der Glasfront entlang, durch die Fluggastbrücke ins Flugzeug.
  function walkPath(gi, lane) {
    const g = lay.gates[gi], p = S.planes[S.gates[gi]];
    const bx = g.x + lay.slotW * 0.3, doorY = g.y - p.len * gateC(p) * 0.22;
    return poly([[lay.exit.x + (lane - 1.5) * lay.d * 0.8, lay.exit.y], [lay.cx, lay.gy0 - 10], [bx, lay.gy0 - 10], [bx, doorY], [g.x + lay.gc * 0.12, doorY]]);
  }

  // ---------- Eingabe ----------
  function onTap(e) {
    audioInit();
    if (ended || !S || !$("#overlay").hidden || peeking) return;
    const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / Z, y = (e.clientY - r.top) / Z;
    // Terminal links und rechts vom Wartering: Bauplätze, Antippen öffnet den Ausbau.
    const tf = lay.tafel;
    if (tf && !tut && Math.abs(x - tf.x) < tf.w / 2 + 4 && y < tf.y + 4 && y > tf.y - tf.h - 4) { showTafel(); return; }
    if (y < lay.gy0 - 10 && y > lay.top + 20 && !tut) {
      const ringL = lay.x0 - lay.rad - lay.laneW / 2 - 6, ringR = lay.x1 + lay.rad + lay.laneW / 2 + 6;
      if (x < ringL || x > ringR) { showShop(); return; }
    }
    // Seitenstreifen neben dem Vorfeld: links Fluglotse, rechts Pilot.
    if (y > lay.ay - 10) {
      const mode = x < lay.ax - 2 ? "slow" : x > lay.ax + S.cols * lay.cell + 2 ? "fast" : "";
      if (mode === "slow" && chal?.id === "eile") { toast("Manu hat heute frei"); return; }
      if (mode) {
        const t = now();
        if (speedOn(t) !== mode) { speed.shout = SHOUTS[mode][(Math.random() * SHOUTS[mode].length) | 0]; sfx[mode === "fast" ? "engine" : "whistle"](); }
        // Eiswagen hält den Fluglotsen, die Band den Piloten länger bei Laune.
        speed.mode = mode; speed.until = t + BOOST * fx(mode === "slow" ? "eis" : "band", "dur", 1); speed.held = true;
        return;
      }
    }
    const c = lay.cell, gx = Math.floor((x - lay.ax) / c), gy = Math.floor((y - lay.ay) / c);
    let hit = null;
    for (const p of S.planes) {
      if (p.where !== "apron") continue;
      if (A.cellsOf(p).some(([a, b]) => a === gx && b === gy)) { hit = p; break; }
    }
    if (!hit) return;
    const step = tut && TUT[tut.step];
    if (step && (step.lock || (step.target !== undefined && hit.id !== step.target))) return;
    const v = vis.get(hit.id);
    if (v && v.kind === "spawn" && now() - v.t0 < 0.35) return;
    const tow = towArmed && A.freeRun(S, hit) >= 0;
    const res = A.tap(S, hit.id, tow), t = now();
    if (res.ok) {
      vis.set(hit.id, { kind: "taxi", t0: t, tow, ...taxiPath(hit) });
      if (res.spawned !== null) vis.set(res.spawned, { kind: "spawn", t0: t });
      if (tow) { tows--; towsUsed++; towArmed = false; syncTow(); hideHint(); sfx.tow(); toast("Abgeschleppt!"); } else sfx.go();
      if (step && step.on === "go") tutNext();
    } else if (res.reason === "blocked" || res.reason === "fixed") {
      vis.set(hit.id, { kind: "bump", t0: t, dist: (res.free + 0.22) * c });
      sfx.bump();
      if (res.reason === "fixed") toast("Der Abschleppwagen kommt hier nicht durch");
      if (step && step.on === "bump") tutNext();
    } else if (res.reason === "locked") {
      vis.set(hit.id, { kind: "bump", t0: t, dist: c * 0.18 });
      sfx.bump(); toast(`Schloss ${hit.lockNo}: erst Bus mit Schlüssel ${hit.lockNo} abfahren lassen`, 1900);
    } else if (res.reason === "gates") {
      gateFlash = t; shakeT = t; toast("Alle Busbuchten belegt"); sfx.bump();
    }
  }
  cv.addEventListener("pointerdown", onTap);
  const release = () => { if (speed.held) { speed.held = false; speed.until = Math.max(speed.until, now() + 0.3); } };
  window.addEventListener("pointerup", release);
  window.addEventListener("pointercancel", release);

  // ---------- Ablauf ----------
  function burst(x, y, dest) {
    const cols = [A.DEST[dest].color, A.DEST[dest].color2, "#FFFFFF", A.DEST[dest].color];
    for (let k = 0; k < 28; k++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 140;
      confetti.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 90, r: Math.random() * 6, vr: (Math.random() - 0.5) * 14, c: cols[k % cols.length], t0: now() });
    }
  }
  function update(t, dt) {
    if (!S) return;
    for (const [id, v] of vis) {
      if (v.kind === "taxi" && t - v.t0 >= v.dur) { A.arrive(S, id); vis.delete(id); }
      else if ((v.kind === "bump" && t - v.t0 > 0.32) || (v.kind === "spawn" && t - v.t0 > 0.4)) vis.delete(id);
    }
    ringT += dt;
    const sp = speedOn(t);
    tickNow = sp === "fast" ? fx("band", "fast", TICK_FAST) : sp === "slow" ? fx("eis", "slow", TICK_SLOW) : chal?.id === "eile" ? 0.2 : TICK;
    if (ringT > tickNow) ringT = Math.min(ringT, tickNow * 2);
    while (ringT >= tickNow) {
      ringT -= tickNow;
      const r = A.tick(S);
      for (const b of r.boards) {
        const p = S.planes[b.plane];
        addPass(b.dest);
        flyers.push({ pl: walkPath(p.gate, b.lane), t0: t + b.lane * 0.05, dest: b.dest, v: (b.plane * 7 + b.lane + p.seatsLeft) % 20, gate: p.gate, fill: 1 - p.seatsLeft / A.SEATS[p.len], full: b.full });
        if (b.full) vis.set(b.plane, { kind: "full", t0: t });
      }
      if (r.entered) shift[r.entered.side] += ((r.entered.after >> 2) - (r.entered.before >> 2)) * lay.d;
    }
    // Landet ein Tourist im Flugzeug: Steeldrum-Ton, Flugzeug federt, Funke.
    flyers = flyers.filter(f => {
      if (t - f.t0 < FLY) return true;
      const g = lay.gates[f.gate];
      pulse[f.gate] = t;
      sparks.push({ x: g.x + (Math.random() - 0.5) * lay.gc, y: g.y + (Math.random() - 0.5) * lay.gc * 1.5, t0: t });
      if (t - lastPlop > 0.03) { sfx.board(f.fill); lastPlop = t; }
      if (f.full) { sfx.full(); burst(g.x, g.y, f.dest); }
      return false;
    });
    for (const [id, v] of vis) {
      if (v.kind === "full" && t - v.t0 > FULL_WAIT) {
        const p = S.planes[id], gp = lay.gates[p.gate];
        A.depart(S, id); vis.delete(id);
        departing.push({ p, x: gp.x, y: gp.y, t0: t });
        // Souvenirstand: Jeder Abflug bringt eine Muschel Trinkgeld.
        const tip = fx("souvenir", "tip", 0) + (p.len === 4 ? fx("souvenir", "big", 0) : 0);
        if (tip) { tips += tip; floats.push({ x: gp.x, y: gp.y - lay.slotH * 0.4, t0: t, txt: `+${tip} Brezn` }); }
        sfx.whoosh();
        const step = tut && TUT[tut.step];
        if (step && step.on === "depart" && step.id === id) tutNext();
      }
    }
    for (const p of S.planes) {
      if (p.lock >= 0 && !p.opened && !A.isLocked(S, p)) { p.opened = true; toast(`Schloss ${p.lockNo} offen`); sfx.go(); }
    }
    departing = departing.filter(d => t - d.t0 < 1.6);
    sparks = sparks.filter(s => t - s.t0 < 0.45);
    confetti = confetti.filter(p => t - p.t0 < 1.6);
    for (const p of confetti) { p.vy += 260 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.985; p.r += p.vr * dt; }
    const k = Math.exp(-dt * 12);
    shift.L *= k; shift.R *= k;
    if (!ended && !flyers.length && ![...vis.values()].some(v => v.kind === "taxi" || v.kind === "full")) {
      const s = A.status(S);
      if (s === "win") finish(true);
      else if (s === "lose") finish(false);
    }
  }

  function finish(won) {
    ended = true;
    musicDuck(0.25, 3);
    if (tut) { tut = null; hideHint(); }
    setTimeout(() => {
      store.set("abpfiff.pass", pass);
      if (chal) return finishChallenge(won);
      if (won) {
        maxLevel = Math.max(maxLevel, levelIdx + 1);
        store.set("abpfiff.max", maxLevel);
        setStreak(streak + 1);
        sfx.win();
        const next = levelIdx + 1;
        // Muscheln: Grundbetrag, mehr für große Level, Bonus für die Serie.
        // Strandbar: +20 %. Souvenirstand: Trinkgeld aus den Abflügen kommt dazu.
        // Sterne: 1 fürs Schaffen, 2 ohne zweite Chance, 3 zusätzlich ohne Schlepper. Neue Sterne bringen Muscheln.
        const stars = S.gateCount === S.baseGates ? (towsUsed ? 2 : 3) : 1, before = starsBy[levelIdx] || 0;
        const fresh = Math.max(0, stars - before), starGain = fresh * (fx("bar", "starBonus", 10) + fx("vitrine", "star", 0));
        if (fresh) { starsBy[levelIdx] = stars; store.set("abpfiff.stars", starsBy); }
        const base = 10 + Math.round(lv.tourists / 40) + 3 * Math.min(3, streak) * fx("halle", "streak", 1);
        const gain = Math.round(base * (1 + fx("bar", "bonus", 0)) * (lv.storm ? fx("schirm", "storm", 2) : 1)) + tips + starGain;
        shells += gain; store.set("abpfiff.shells", shells);
        const item = nextBuy(), canBuild = item && shells >= item.cost;
        // Kurz und klar: Sterne mit Bedingung, eine Zeile Belohnungen, ein Hauptknopf, kleine Nebenknöpfe.
        const goals = ["Geschafft", "Ohne 2. Chance", "Ohne Abschleppen"], tw = Math.min(3, streak);
        const why = [lv.storm ? `Sturm ×${fx("schirm", "storm", 2)}` : "", has("bar") ? "Biergarten" : "", has("halle") && streak ? "Hall of Fame" : "", tips ? "Fanshop" : "", fresh ? `${fresh} neue Sterne` : ""].filter(Boolean).join(", ");
        const canChal = levelIdx > 0 && !chalDone[levelIdx];
        showCard(`
          <div class="eyebrow">Level ${levelIdx + 1} geschafft</div>
          <h2>Alle auf dem Heimweg!</h2>
          <div class="stars3" role="img" aria-label="${stars} von 3 Sternen">${goals.map((g, k) => `<div class="${k < stars ? "on" : ""}"><span style="animation-delay:${(k + 1) * 0.18}s">★</span><small>${g}</small></div>`).join("")}</div>
          <div class="loot">
            <div class="chip-l shell" title="${why}"><b>+${gain}</b> Brezn${why ? `<small>${why}</small>` : ""}</div>
            <div class="chip-l"><b>Serie ${streak}</b><span class="dots">${[1, 2, 3].map(k => `<i class="${streak >= k ? "on" : ""}"></i>`).join("")}</span><small>${tw} Abschleppwagen fürs nächste Level</small></div>
          </div>
          ${newStamps.length ? `<div class="loot-stamps" aria-label="Neue Sticker">${newStamps.map(s => `<img src="${flagURL(s.d)}" alt="${A.DEST[s.d].name}: ${STAMPS[s.tier].name}" title="${A.DEST[s.d].name}: ${STAMPS[s.tier].name}">`).join("")}<span>Neue Sticker im Album</span></div>` : ""}
          <div class="actions">
            <button class="btn" id="nextBtn">Weiter zu Level ${next + 1}</button>
            <div class="minis">
              <button class="mini ${canBuild ? "hot" : ""}" id="isleBtn">Ausbauen${canBuild ? `<small>${item.name}</small>` : item ? `<small>noch ${item.cost - shells}</small>` : ""}</button>
              ${canChal ? `<button class="mini" id="chalBtn">${chalFor(levelIdx).name}<small>+${chalReward(levelIdx)}</small></button>` : ""}
              <button class="mini" id="againBtn">Nochmal</button>
            </div>
          </div>`);
        $("#isleBtn")?.addEventListener("click", () => showShop(next));
        $("#chalBtn")?.addEventListener("click", () => startLevel(levelIdx, chalFor(levelIdx)));
        $("#nextBtn").addEventListener("click", () => startLevel(next));
        $("#againBtn").addEventListener("click", () => startLevel(levelIdx));
        // Nächstes Level schon vorbereiten, solange die Karte zu sehen ist.
        setTimeout(() => { if (!cache[next]) cache[next] = A.generate(next); }, 300);
      } else {
        sfx.lose();
        // Zweite Chance: einmal pro Level ein Extra-Gate. Ist sie verbraucht, ist die Serie weg.
        const canGate = S.gateCount === S.baseGates, left = lv.tourists - S.boarded, had = streak;
        if (!canGate) setStreak(0);
        // Kompakt wie die Gewinnkarte: Fortschritt groß, Serie als Kachel, ein Hauptknopf.
        const pct = Math.round((S.boarded / lv.tourists) * 100);
        showCard(`
          <div class="eyebrow">Level ${levelIdx + 1}</div>
          <h2>${left <= lv.tourists * 0.25 ? "So knapp!" : "Abfahrt verzögert"}</h2>
          <p class="small">${S.gates.slice(0, S.gateCount).some(g => g === null) ? "Kein Bus kann mehr fahren: Schloss oder Hindernis im Weg." : "Alle Busbuchten belegt, und kein Fan im Umlauf passt."}</p>
          <div class="progress" role="img" aria-label="${pct} Prozent im Bus">
            <div class="meter"><span style="width:${pct}%"></span></div>
            <div class="progress-l"><b>${pct} %</b> im Bus<span>noch ${left} warten</span></div>
          </div>
          ${had ? `<div class="loot one"><div class="chip-l ${canGate ? "warn" : ""}"><b>Serie ${had}</b><small>${canGate ? "steht auf dem Spiel" : "ist vorbei"}</small></div></div>` : ""}
          <div class="actions">
            ${canGate ? `<button class="btn" id="extraBtn">Zweite Chance: Extra-Busbucht</button><div class="minis"><button class="mini" id="againBtn">Aufgeben</button><button class="mini" id="menuBtn">Levelwahl</button></div>` : `<button class="btn" id="againBtn">Nochmal versuchen</button><div class="minis"><button class="mini" id="isleBtn">Ausbauen</button><button class="mini" id="menuBtn">Levelwahl</button></div>`}
          </div>`);
        $("#menuBtn").addEventListener("click", () => { if (canGate) setStreak(0); showMenu("lvl"); });
        $("#isleBtn")?.addEventListener("click", () => showShop(levelIdx));
        $("#extraBtn")?.addEventListener("click", () => {
          openExtraGate(); $("#overlay").hidden = true; ended = false;
          const bonus = fx("turm", "extra", 0);
          if (bonus) { tows += bonus; syncTow(); toast(`Verkehrsleitung: +${bonus} Abschleppwagen`); }
        });
        $("#againBtn").addEventListener("click", () => { setStreak(0); startLevel(levelIdx); });
      }
    }, won ? 900 : 350);
  }
  function finishChallenge(won) {
    const i = levelIdx, c = chal, meter = `<div class="meter"><span style="width:${Math.round((S.boarded / lv.tourists) * 100)}%"></span></div>`;
    if (won) {
      sfx.win();
      const first = !chalDone[i], reward = first ? chalReward(i) : 0;
      if (first) { chalDone[i] = true; store.set("abpfiff.chal", chalDone); shells += reward; store.set("abpfiff.shells", shells); }
      showCard(`
        <div class="eyebrow">Herausforderung · Level ${i + 1}</div>
        <div class="medal" aria-hidden="true">★</div>
        <h2>${c.name} gemeistert!</h2>
        <p>${first ? `Neue Medaille und <b>+${reward} Brezn</b>.` : "Die Medaille hast du schon. Respekt gibt es trotzdem."}</p>
        <div class="actions">
          <button class="btn" id="nextBtn">Weiter zu Level ${maxLevel + 1}</button>
          <button class="btn alt" id="menuBtn">Weitere Herausforderungen</button>
        </div>`);
      $("#nextBtn").addEventListener("click", () => startLevel(maxLevel));
      $("#menuBtn").addEventListener("click", () => showMenu("chal"));
    } else {
      sfx.lose();
      showCard(`
        <div class="eyebrow">Herausforderung · Level ${i + 1}</div>
        <h2>${c.name}: knapp daneben</h2>
        <p>Nur noch <b>${lv.tourists - S.boarded}</b> von ${lv.tourists} Fans warten.</p>
        ${meter}
        <div class="actions">
          <button class="btn" id="againBtn">Nochmal versuchen</button>
          <button class="btn alt" id="normBtn">Normales Level spielen</button>
        </div>`);
      $("#againBtn").addEventListener("click", () => startLevel(i, c));
      $("#normBtn").addEventListener("click", () => startLevel(i));
    }
  }
  function openExtraGate() {
    if (!S || S.gateCount > S.baseGates) return;
    S.gateCount = S.baseGates + 1; sfx.go();
  }
  function setStreak(n) { streak = n; store.set("abpfiff.streak", n); }

  // Läuft das Level schon? Dann kostet Abbrechen die Serie.
  function inProgress() { return S && !ended && (S.boarded > 0 || S.planes.some(p => p.where !== "apron" && p.where !== "hangar")); }
  function syncTow() {
    $("#towBtn").hidden = tows <= 0;
    $("#towN").textContent = tows;
    $("#towBtn").classList.toggle("armed", towArmed);
    $("#towBtn").setAttribute("aria-pressed", towArmed);
  }
  function addPass(d) {
    const id = A.DEST[d].id;
    pass[id] = (pass[id] || 0) + 1;
    const tier = STAMPS.findIndex(s => s.n === pass[id]);
    if (tier < 0) return;
    newStamps.push({ d, tier });
    store.set("abpfiff.pass", pass);
    toast(`Sticker: ${A.DEST[d].name} · ${STAMPS[tier].name}`, 1800);
    sfx.stamp();
  }

  // ---------- Flughafen ausbauen ----------
  // Muscheln aus den Siegen kaufen Bauten und Deko direkt im Spielbild: Terminal links und rechts

  }
  function stadiumPts(k) {

  function drawArmLane(side) {

  }
  function drawBarrier(side, t) {

  function drawGates(t) {
    const { gy0, gatesH, slotW, slotH, gates, gc } = lay, I = lay.island;
    ctx.fillStyle = simple ? C.asphalt : asphaltPat(); ctx.fillRect(I.x, gy0, I.w, gatesH + 16);
    ctx.setLineDash([10, 8]); ctx.strokeStyle = C.line; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(I.x + 10, lay.laneY); ctx.lineTo(I.x + I.w - 10, lay.laneY); ctx.stroke(); ctx.setLineDash([]);
    const flash = t - gateFlash < 0.6 ? 1 - (t - gateFlash) / 0.6 : 0;
    gates.forEach((g, i) => {
      const x = g.x - slotW / 2 + 4, y = gy0 + 6, w = slotW - 8;
      const locked = i >= S.gateCount;
      ctx.fillStyle = locked ? "rgba(0,0,0,.18)" : flash ? `rgba(255,111,97,${0.45 * flash + 0.06})` : "rgba(255,255,255,.07)";
      rr(ctx, x, y, w, slotH + 6, 10); ctx.fill();
      ctx.setLineDash([6, 5]); ctx.strokeStyle = locked ? "rgba(255,255,255,.3)" : "rgba(255,255,255,.8)"; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
      ctx.font = `800 12px ${FONT}`; ctx.textAlign = "left"; ctx.textBaseline = "top";
      ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.fillText("B" + (i + 1), x + 6, y + 3);
      const id = S.gates[i];
      const p = id === null ? null : S.planes[id];
      const docked = p && p.where !== "taxi";
      // Fluggastbrücke: fährt aus, sobald ein Flugzeug steht
      const bx = g.x + slotW * 0.3, doorY = docked ? g.y - p.len * gateC(p) * 0.22 : gy0 + 10;
      ctx.fillStyle = "rgba(0,0,0,.22)"; rr(ctx, bx - 3, gy0, 12, doorY - gy0 + 8, 4); ctx.fill();
      ctx.fillStyle = "#C3C9CF"; rr(ctx, bx - 6, gy0 - 2, 12, doorY - gy0 + 6, 4); ctx.fill();
      if (!simple) { ctx.fillStyle = "rgba(255,255,255,.4)"; ctx.fillRect(bx - 4, gy0, 3, doorY - gy0); }
      if (locked && i === S.gateCount && i === S.baseGates) {
        // Gesperrtes Extra-Gate: öffnet nur als zweite Chance nach einer Niederlage.
        ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "rgba(255,255,255,.45)";
        ctx.font = `800 13px ${FONT}`; ctx.fillText("2.", g.x, g.y - 4);
        ctx.font = `800 11px ${FONT}`; ctx.fillText("Chance", g.x, g.y + 9);
      } else if (locked) {
        ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "rgba(255,255,255,.35)";
        ctx.font = `800 12px ${FONT}`; ctx.fillText("gesperrt", g.x, g.y);
      }
      if (!docked) return;
      const v = vis.get(id), dst = A.DEST[p.dest];
      const pu = pulse[i] ? Math.max(0, 1 - (t - pulse[i]) / 0.16) : 0;
      const isFull = v && v.kind === "full" && t - v.t0 > FLY + 0.1;
      const seats = A.SEATS[p.len], landed = Math.max(0, seats - p.seatsLeft - flyers.filter(f => f.gate === i).length);
      const bh = slotH - 18, bxx = x + 5, bt = y + 20;
      ctx.fillStyle = "rgba(0,0,0,.3)"; rr(ctx, bxx, bt, 5, bh, 2.5); ctx.fill();
      const fh = (bh * landed) / seats;
      if (fh > 0) { ctx.fillStyle = dst.color; rr(ctx, bxx, bt + bh - fh, 5, fh, 2.5); ctx.fill(); }
      drawPlane(g.x, g.y, -Math.PI / 2, gateC(p), p, 1, 0, 1 + 0.1 * pu);

  }

  function drawApron(t) {
    const { ax, ay, cell: c } = lay;
    ctx.fillStyle = simple ? C.asphalt : asphaltPat();
    for (let y = 0; y < S.rows; y++) for (let x = 0; x < S.cols; x++) {
      if (S.mask[y][x]) { rr(ctx, ax + x * c - 4, ay + y * c - 4, c + 8, c + 8, 10); ctx.fill(); }
    }
    ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.lineWidth = 1.3;
    for (let y = 0; y < S.rows; y++) for (let x = 0; x < S.cols; x++) {
      if (S.mask[y][x]) { rr(ctx, ax + x * c + 3, ay + y * c + 3, c - 6, c - 6, 6); ctx.stroke(); }
    }
    for (const h of S.hangars) {
      const [dx, dy] = A.DIRS[h.dir];
      const hx = ax + (h.x + 0.5) * c, hy = ay + (h.y + 0.5) * c;
      let ex = h.x, ey = h.y;
      while (ex + dx >= 0 && ey + dy >= 0 && ex + dx < S.cols && ey + dy < S.rows) { ex += dx; ey += dy; }

      ctx.save(); ctx.translate(hx, hy); ctx.rotate(ANG[h.dir] + Math.PI / 2);
      ctx.fillStyle = "rgba(0,0,0,.25)"; rr(ctx, -c * 0.42 + 2, -c * 0.42 + 4, c * 0.84, c * 0.84, c * 0.25); ctx.fill();
      ctx.fillStyle = "#90A4AE"; rr(ctx, -c * 0.42, -c * 0.42, c * 0.84, c * 0.84, c * 0.25); ctx.fill();
      ctx.fillStyle = "#FFFFFF"; for (let i = 0; i < 3; i++) ctx.fillRect(-c * 0.32, -c * 0.2 + i * c * 0.18, c * 0.64, c * 0.07);
      ctx.fillStyle = "#33414D"; rr(ctx, -c * 0.26, -c * 0.47, c * 0.52, c * 0.18, 4); ctx.fill();
      ctx.restore();

        const r = Math.max(9, c * 0.22);
        ctx.fillStyle = C.teal; ctx.beginPath(); ctx.arc(hx + c * 0.3, hy + c * 0.3, r, 0, 7); ctx.fill();
        ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 2; ctx.stroke();

      }
      if (v && v.kind === "spawn") { const s = Math.min(1, (t - v.t0) / 0.4), o = (1 - s) * c * 1.4; x -= dx * o; y -= dy * o; alpha = s; }

      const off = p.len * c * 0.5 - Math.max(9, c * 0.26) * 1.1, bx = x - dx * off, by = y - dy * off;

  // Feste Hindernisse: Gepäckwagen, Palme, Tankwagen.
  function drawObstacle(x, y, c, kind) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.beginPath(); ctx.ellipse(c * 0.05, c * 0.28, c * 0.36, c * 0.14, 0, 0, 7); ctx.fill();

      ctx.fillStyle = "#3FA65A"; ctx.beginPath(); ctx.arc(0, -c * 0.12, c * 0.24, 0, 7); ctx.fill();
      ctx.fillStyle = "#5CC074"; ctx.beginPath(); ctx.arc(-c * 0.08, -c * 0.2, c * 0.09, 0, 7); ctx.fill();
    } else if (kind === 2) {

      ctx.strokeStyle = "#B0BAC3"; ctx.lineWidth = Math.max(1.5, c * 0.05);

      ctx.fillStyle = "#6B747C"; ctx.fillRect(-c * 0.44, c * 0.12, c * 0.16, c * 0.06); ctx.fillRect(c * 0.28, c * 0.12, c * 0.16, c * 0.06);

  function lockBadge(x, y, c, no, kind) {

    }
    ctx.restore();
    ctx.fillStyle = "#FFFFFF"; ctx.strokeStyle = col; ctx.lineWidth = 2.5;

  function drawTutorial(t) {
    const step = tut && TUT[tut.step];
    if (!step || step.target === undefined) return;
    const p = S.planes[step.target];
    if (p.where !== "apron") return;
    const { x, y } = planeCenter(p), c = lay.cell;

  // ---------- Hinweise und Karten ----------

  // Levelwahl mit zwei Reitern: normale Level und Herausforderungen geschaffter Level.

      tab === "chal" ? startLevel(i, chalFor(i)) : startLevel(i);
    }));
    $("#closeBtn").addEventListener("click", () => ($("#overlay").hidden = true));
  }
  // Startschirm: Titel, Weiterspielen und alle erreichten Level mit ihren Sternen.
  function showStart() {
    const total = Object.values(starsBy).reduce((a, b) => a + b, 0), medals = Object.keys(chalDone).length;
    const btns = Array.from({ length: maxLevel + 1 }, (_, i) => {
      const L = A.levelDef(i), st = starsBy[i] || 0;
      return `<button data-l="${i}" class="${i === maxLevel ? "cur" : ""} ${A.isStorm(i) ? "storm" : ""}" aria-label="Level ${i + 1}: ${L.name}, ${st} von 3 Sternen">${i + 1}<small>${"★".repeat(st) + "☆".repeat(3 - st)}</small></button>`;
    }).join("");
    showCard(`
      <div class="eyebrow">${total} Sterne · ${medals} Medaillen</div>
      <h2>Abpfiff!</h2>
      <p class="small">Die Gästefans haben mal wieder beim FC Hollywood verloren. Bring sie in die richtigen Busse nach Hause.</p>
      <div class="actions"><button class="btn" id="goBtn">${maxLevel ? `Weiter mit Level ${maxLevel + 1}` : "Los geht's"}</button></div>
      ${maxLevel ? `<p class="small">Oder spiele ein geschafftes Level noch einmal, um mehr Sterne zu holen:</p><div class="levels">${btns}</div>` : ""}
      <div class="actions"><button class="btn alt" id="isleBtn">Stadion ausbauen</button><div class="minis"><button class="mini" id="simpleBtn">Einfache Figuren: ${simple ? "an" : "aus"}<small>ruhiges Bild ohne Deko</small></button></div></div>`);
    hideHint();
    $("#simpleBtn").addEventListener("click", () => { setSimple(!simple); showStart(); });
    $("#goBtn").addEventListener("click", () => startLevel(maxLevel));
    $("#isleBtn").addEventListener("click", () => showShop());
    $("#card").querySelectorAll("[data-l]").forEach(b => b.addEventListener("click", () => startLevel(+b.dataset.l)));
    $(".levels .cur")?.scrollIntoView({ block: "nearest" });
  }
  $("#restartBtn").addEventListener("click", () => {
    if (!$("#overlay").hidden) return;
    if (chal) return startLevel(levelIdx, chal);
    if (!(streak > 0 && inProgress())) return startLevel(levelIdx);
    showCard(`
      <div class="eyebrow">Level ${levelIdx + 1}</div>
      <h2>Neu starten?</h2>
      <p>Deine Siegesserie von ${streak} geht dabei verloren.</p>
      <div class="actions"><button class="btn" id="stayBtn">Weiterspielen</button><button class="btn alt" id="againBtn">Neu starten</button></div>`);
    $("#stayBtn").addEventListener("click", () => ($("#overlay").hidden = true));
    $("#againBtn").addEventListener("click", () => { setStreak(0); startLevel(levelIdx); });
  });
  $("#towBtn").addEventListener("click", () => {
    audioInit();
    if (tows <= 0 || ended || tut) return;
    towArmed = !towArmed; syncTow();
    if (towArmed) showHint("<b>Abschleppwagen bereit.</b> Tippe einen zugeparkten Bus an. Er zieht ihn direkt in eine Busbucht.", 0); else hideHint();
  });
  $("#passBtn").addEventListener("click", () => { if ($("#overlay").hidden) showPass(); });
  // Optik-Schalter in der Kopfzeile: detailliert oder einfach, ohne Umweg über das Menü.
  function syncLook() {
    $("#lookDetail").style.opacity = simple ? 0 : 1;
    const txt = simple ? "Optik: einfach. Antippen für detailliert" : "Optik: detailliert. Antippen für einfach";
    $("#lookBtn").setAttribute("aria-label", txt); $("#lookBtn").title = txt;
  }
  function setSimple(on) { simple = on; store.set("abpfiff.simple", simple); syncLook(); }
  $("#lookBtn").addEventListener("click", () => { setSimple(!simple); toast(simple ? "Optik: einfach" : "Optik: detailliert"); });
  syncLook();
  function syncMute() { $("#muteWave").style.opacity = muted ? 0 : 1; $("#muteBtn").setAttribute("aria-label", muted ? "Ton an" : "Ton aus"); }
  $("#muteBtn").addEventListener("click", () => { muted = !muted; store.set("abpfiff.muted", muted); syncMute(); if (muted) musicStop(); audioInit(); });

  // ---------- Ton: Steeldrum ----------
  let ac = null;
  // Auf Touch-Geräten zählt pointerdown nicht als Nutzergeste, erst pointerup/touchend/click.
  // iOS: audioSession "playback" spielt auch bei stummgeschaltetem Klingelschalter.
  function audioInit() {
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
      const b = ac.createBuffer(1, 1, 22050), src = ac.createBufferSource();
      src.buffer = b; src.connect(ac.destination); src.start(0);
      buses();
    }
    if (ac.state !== "running") ac.resume().catch(() => {});
    musicStart();
  }
  // Mischpult: Effekte und Musik laufen über einen gemeinsamen Hall, das klingt weicher und luftiger.
  let bus = null;
  function buses() {
    const master = ac.createGain(), sfxG = ac.createGain(), musG = ac.createGain(), rev = ac.createConvolver(), revG = ac.createGain();
    const len = ac.sampleRate * 1.8, ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 3; }
    rev.buffer = ir; revG.gain.value = 0.28; musG.gain.value = 0.8;
    const musIn = ac.createGain(), musLp = ac.createBiquadFilter();
    musLp.type = "lowpass"; musLp.frequency.value = 16000;
    musIn.connect(musLp).connect(musG);
    sfxG.connect(master); musG.connect(master); sfxG.connect(rev); musG.connect(rev); rev.connect(revG).connect(master); master.connect(ac.destination);
    bus = { sfx: sfxG, mus: musIn, musGain: musG, musLp };
  }
  const out = () => (bus ? bus.sfx : ac.destination);
  document.addEventListener("visibilitychange", () => {
    if (!ac) return;
    if (document.hidden) ac.suspend(); else if (!muted) ac.resume().catch(() => {});
  });
  ["pointerup", "touchend", "click", "keydown"].forEach(ev => window.addEventListener(ev, audioInit, { passive: true }));
  function tone(freq, dur, type = "sine", vol = 0.12, slide = 1, delay = 0) {
    if (muted || !ac) return;
    const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(freq * slide, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(out()); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  // Kurzer Blechbläser-Ton (heißt noch steel): Sägezahn hinter einem Tiefpass, der kurz aufgeht.
  function steel(f, dur = 0.4, vol = 0.08, delay = 0) {
    if (muted || !ac) return;
    const t0 = ac.currentTime + delay, g = ac.createGain(), f1 = ac.createBiquadFilter();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    f1.type = "lowpass"; f1.frequency.setValueAtTime(900, t0); f1.frequency.linearRampToValueAtTime(3200, t0 + 0.04); f1.frequency.exponentialRampToValueAtTime(1200, t0 + dur);
    f1.connect(g); g.connect(out());
    const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.setValueAtTime(f, t0); o.connect(f1); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  const sfx = {
    go: () => { steel(330, 0.25, 0.06); steel(494, 0.3, 0.05, 0.06); },
    bump: () => tone(190, 0.2, "sine", 0.12, 0.55),
    // Tonleiter steigt mit dem Füllstand: je voller, desto höher.
    board(fill) {
      const steps = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
      steel(392 * 2 ** (steps[Math.min(steps.length - 1, Math.floor(fill * steps.length))] / 12), 0.32, 0.07);
    },
    full: () => [523, 659, 784, 1046].forEach((f, i) => steel(f, 0.5, 0.08, i * 0.07)),
    // Abfahrt: Motor brummt an, zweimal Hupe.
    whoosh() {
      if (muted || !ac) return;
      tone(70, 0.9, "sawtooth", 0.04, 1.8); tone(392, 0.16, "square", 0.035, 1, 0.1); tone(494, 0.22, "square", 0.035, 1, 0.3);
      return;
      const len = 1.0, buf = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t0 = ac.currentTime;
      src.buffer = buf; f.type = "bandpass"; f.Q.value = 1.2;
      f.frequency.setValueAtTime(300, t0); f.frequency.exponentialRampToValueAtTime(2400, t0 + len);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.1, t0 + 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
      src.connect(f).connect(g).connect(out()); src.start(t0);
    },
    win: () => [523, 659, 784, 659, 784, 1046].forEach((f, i) => steel(f, 0.45, 0.08, i * 0.13)),
    lose: () => [392, 330, 262].forEach((f, i) => steel(f, 0.5, 0.07, i * 0.16)),
    tow: () => { tone(110, 0.4, "triangle", 0.12, 1.6); steel(392, 0.3, 0.05, 0.12); steel(587, 0.35, 0.05, 0.2); },
    build: () => { tone(120, 0.15, "triangle", 0.2, 0.6); [523, 659, 784, 1046, 1318].forEach((f, i) => steel(f, 0.5, 0.07, 0.08 + i * 0.08)); },
    whistle: () => { tone(2300, 0.1, "sine", 0.05, 1.04); tone(2300, 0.22, "sine", 0.05, 0.96, 0.13); },
    engine: () => { tone(330, 0.12, "square", 0.04); tone(440, 0.18, "square", 0.04, 1, 0.12); },
    stamp: () => { tone(150, 0.12, "triangle", 0.22, 0.5); steel(1046, 0.5, 0.08, 0.1); steel(1318, 0.6, 0.07, 0.2); },
  };

  // ---------- Musik: live erzeugt, Stil je nach Lage ----------
  // Eigene Kompositionen im Stil, keine Stücke aus anderen Spielen, daher lizenzfrei.
  // son:   entspannter kubanischer Son für normale Level (Clave 3-2, Bongos, Tumbao-Bass, Gitarre, Marimba)
  // house: Tropical House für Herausforderungen (Four-on-the-floor, Offbeat-Bass, Marimba-Stabs, Fläche)
  // funk:  Brasil-Funk mit Tamborzão-Groove für Sturm-Level
  // Pilot beschleunigt die Musik, der Fluglotse bremst sie und dämpft die Höhen.
  let musicOn = store.get("abpfiff.music", true), mus = null, noiseBuf = null, musicStyle = "son";
  const STYLES = {
    son: { bpm: 116, sub: 2, swing: 0, prog: [[0, "maj"], [7, "dom"], [7, "dom"], [0, "maj"], [0, "maj"], [5, "maj"], [7, "dom"], [0, "maj"]] },
    house: { bpm: 108, sub: 2, swing: 0, prog: [[9, "min"], [5, "maj"], [0, "maj"], [7, "maj"]] },
    funk: { bpm: 128, sub: 4, swing: 0, prog: [[4, "min"], [4, "min"], [0, "maj"], [2, "maj"]] },
  };
  const TONES = { maj: [0, 4, 7], min: [0, 3, 7], dom: [0, 4, 7, 10] };
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
  const CLAVE = [[0, 3, 6], [2, 4]];
  const mtof = m => 440 * 2 ** ((m - 69) / 12);
  function setMusicStyle(st) {
    if (st === musicStyle) return;
    musicStyle = st;
    if (mus) { mus.step = 0; mus.mel = 4; }
  }
  function musicStart() {
    if (!ac || !bus || mus || !musicOn || muted) return;
    mus = { next: ac.currentTime + 0.15, step: 0, mel: 4, timer: setInterval(musicTick, 25) };
  }
  function musicStop() { if (mus) { clearInterval(mus.timer); mus = null; } }
  function musicDuck(level, secs) {
    if (!bus) return;
    const g = bus.musGain.gain, t = ac.currentTime;
    g.cancelScheduledValues(t); g.setTargetAtTime(0.8 * level, t, 0.08); g.setTargetAtTime(0.8, t + secs, 0.5);
  }
  function musicTick() {
    if (!mus || ac.state !== "running") return;
    const S2 = STYLES[musicStyle], sp = speedOn(now());
    const tempo = sp === "fast" ? 1.15 : sp === "slow" ? 0.85 : 1;
    bus.musLp.frequency.setTargetAtTime(sp === "slow" ? 900 : 16000, ac.currentTime, 0.15);
    const base = 60 / (S2.bpm * tempo) / S2.sub;
    while (mus.next < ac.currentTime + 0.2) {
      PLAY[musicStyle](mus.step, mus.next, base);
      mus.next += base * (S2.swing ? (mus.step % 2 ? 1 - S2.swing : 1 + S2.swing) : 1);
      mus.step++;
    }
  }
  function env(t, peak, attack, decay) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    g.connect(bus.mus);
    return g;
  }
  function osc(type, f, t, dur, to, f2) {
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur * 0.5);
    o.connect(to); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(t, v, hp, dur, band) {
    if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.3, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const src = ac.createBufferSource(), f = ac.createBiquadFilter();
    src.buffer = noiseBuf; f.type = band ? "bandpass" : "highpass"; f.frequency.value = hp; if (band) f.Q.value = 1.2;
    src.connect(f).connect(env(t, v, 0.004, dur)); src.start(t); src.stop(t + dur + 0.05);
  }
  function lp(freq, to) { const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq; f.connect(to); return f; }
  const inst = {
    clave: t => { const g = env(t, 0.07, 0.002, 0.06); osc("sine", 2500, t, 0.08, g); osc("sine", 1650, t, 0.08, g); },
    shaker: (t, v) => noise(t, v, 7000, 0.06),
    hat: (t, v, d = 0.05) => noise(t, v, 8500, d),
    clap: (t, v) => { noise(t, v, 1500, 0.12, true); noise(t + 0.012, v * 0.7, 1500, 0.1, true); },
    kick: (t, v) => { osc("sine", 140, t, 0.3, env(t, v, 0.003, 0.28), 48); osc("triangle", 280, t, 0.04, env(t, v * 0.3, 0.001, 0.03), 120); },
    bongo: (t, f, v) => osc("sine", f, t, 0.14, env(t, v, 0.002, 0.12), f * 0.82),
    conga: (t, v, f = 210) => osc("sine", f, t, 0.3, env(t, v, 0.003, 0.26), f * 0.83),
    // Bass eine Oktave höher und mit Obertönen, damit er auch aus Handylautsprechern hörbar ist.
    bass(f, t, d, v = 0.15) {
      const to = lp(900, env(t, v, 0.012, d));
      osc("triangle", f, t, d, to); osc("sawtooth", f, t, d, lp(600, env(t, v * 0.35, 0.012, d)));
    },
    sub808(f, t, d, v = 0.17) {
      osc("sine", f * 1.5, t, d, env(t, v, 0.005, d), f);
      osc("square", f * 2, t, d * 0.5, lp(700, env(t, v * 0.18, 0.005, d * 0.5)), f * 1.4);
    },
    pluck(f, t, v, d = 0.42) {
      const g = env(t, v, 0.004, d), f1 = ac.createBiquadFilter();
      f1.type = "lowpass"; f1.frequency.setValueAtTime(2600, t); f1.frequency.exponentialRampToValueAtTime(500, t + d * 0.7); f1.connect(g);
      osc("sawtooth", f, t, d + 0.03, f1);
    },
    marimba(f, t, v) {
      osc("sine", f, t, 0.7, env(t, v, 0.003, 0.65));
      osc("sine", f * 4, t, 0.1, env(t, v * 0.25, 0.002, 0.06));
    },
    // Trompete: Sägezahn mit kurz aufgehendem Filter und leichtem Vibrato
    brass(f, t, v, d = 0.3) {
      const g = env(t, v, 0.025, d), f1 = ac.createBiquadFilter();
      f1.type = "lowpass"; f1.frequency.setValueAtTime(800, t); f1.frequency.linearRampToValueAtTime(2800, t + 0.05); f1.frequency.exponentialRampToValueAtTime(1300, t + d); f1.connect(g);
      osc("sawtooth", f, t, d + 0.03, f1); osc("square", f * 1.004, t, d + 0.03, lp(1600, env(t, v * 0.25, 0.025, d)));
    },
    pad(fs, t, d, v) { const to = lp(1100, env(t, v, d * 0.3, d * 0.7)); fs.forEach(f => { osc("sawtooth", f, t, d, to); osc("sawtooth", f * 1.006, t, d, to); }); },
  };
  // Marimba-Phrase: wandert in kleinen Schritten über die Tonleiter und landet auf Akkordtönen.
  function melody(r, ct, pos, t, chance, v) {
    if (Math.random() >= chance) return;
    mus.mel = Math.max(0, Math.min(SCALE.length - 1, mus.mel + [-2, -1, -1, 1, 1, 2][(Math.random() * 6) | 0]));
    let n = SCALE[mus.mel];
    if (pos === 0) { const want = ct.map(c => (r + c) % 12); while (!want.includes(n % 12) && mus.mel > 0) n = SCALE[--mus.mel]; }
    inst.brass(mtof(72 + n), t, v * 0.8, 0.26);
  }
  const PLAY = {
    // Polka der Blaskapelle: Tuba auf 1 und 3, Begleitakkord auf den Nachschlägen, Trompete singt.
    son(step, t, e8) {
      const P = STYLES.son.prog, bar = Math.floor(step / 8), pos = step % 8, [r, q] = P[bar % P.length], ct = TONES[q];
      if (pos === 0) { inst.bass(mtof(48 + r), t, e8 * 1.6, 0.17); inst.kick(t, 0.1); }
      if (pos === 4) { inst.bass(mtof(43 + r), t, e8 * 1.6, 0.15); inst.kick(t, 0.08); }
      if (pos % 4 === 2) ct.slice(0, 3).forEach((c, i) => inst.brass(mtof(60 + r + c), t + i * 0.004, 0.02, e8 * 0.7));
      if (pos % 2 === 0) inst.hat(t, pos % 4 ? 0.018 : 0.03, 0.05);
      if ([0, 1, 2, 3, 6, 7].includes(bar % 8)) melody(r, ct, pos, t, pos % 2 ? 0.25 : 0.65, 0.06);
    },
    house(step, t, e8) {
      const P = STYLES.house.prog, bar = Math.floor(step / 8), pos = step % 8, [r, q] = P[bar % P.length], ct = TONES[q];
      if (pos % 2 === 0) inst.kick(t, 0.22);
      else { inst.hat(t, 0.05, 0.08); inst.bass(mtof(45 + r), t, e8 * 0.9, 0.13); }
      if (pos === 2 || pos === 6) inst.clap(t, 0.06);
      inst.shaker(t, 0.012);
      // Typische 3-3-2-Stabs der Marimba über dem Akkord
      if ([0, 3, 6].includes(pos)) ct.forEach((c, i) => inst.marimba(mtof(69 + r + c), t + i * 0.008, 0.035));
      if (pos === 0) inst.pad(ct.map(c => mtof(57 + r + c)), t, e8 * 8, 0.018);
      if (bar % 4 >= 2) melody(r, ct, pos, t, pos % 2 ? 0.2 : 0.45, 0.05);
    },
    funk(step, t, e16) {
      const P = STYLES.funk.prog, bar = Math.floor(step / 16), pos = step % 16, [r, q] = P[bar % P.length], ct = TONES[q];
      // Tamborzão: Bumm – – Bumm – – – Bumm – – Bumm … mit Tak auf 5 und 13
      if ([0, 3, 7, 10].includes(pos)) { inst.kick(t, 0.24); inst.sub808(mtof(40 + r), t, e16 * 2.5, 0.12); }
      if (pos === 4 || pos === 12) inst.clap(t, 0.075);
      if ([6, 14, 15].includes(pos)) inst.conga(t, 0.08, pos === 15 ? 260 : 220);
      if (pos % 2 === 0) inst.hat(t, pos % 4 ? 0.025 : 0.04, 0.03);
      if ([2, 8, 11].includes(pos)) inst.pluck(mtof(64 + r + ct[pos % ct.length]), t, 0.03, 0.25);
      if (bar % 4 === 3 && pos % 2 === 0) melody(r, ct, pos, t, 0.4, 0.045);
    },
  };

  // ---------- Start ----------
  function frame() {
    const t = now(), dt = Math.min(0.05, t - last || 0);
    last = t;
    // Karte offen mitten im Level: Spiel hält an.
    if (($("#overlay").hidden && !peeking) || ended) update(t, dt);
    draw(t);
    requestAnimationFrame(frame);
  }
  window.addEventListener("resize", layout);
  syncMute();
  window.claude?.hot?.snapshot?.(() => ({ levelIdx }));
  const boot = data => {
    startLevel(data?.levelIdx ?? store.get("abpfiff.level", 0));
    if (data?.levelIdx === undefined) showStart();
    last = now();
    requestAnimationFrame(frame);
  };
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>

<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
